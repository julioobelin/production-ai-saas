services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/knowledge
      JWT_SECRET: replace-with-a-random-string-of-at-least-32-characters
      JWT_EXPIRE_MINUTES: "30"
      RETRIEVAL_MODE: lexical
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ""
      LLM_MODEL: gpt-4o-mini
      EMBEDDING_BASE_URL: https://api.openai.com/v1
      EMBEDDING_API_KEY: ""
      EMBEDDING_MODEL: text-embedding-3-small
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec python -m app"]

volumes:
  postgres-data:
